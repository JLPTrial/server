sonar.projectKey=JLPTrial_server
sonar.projectName=JLPTrial Server
sonar.organization=jlptrial
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py

sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,**/.pytest_cache/**,**/data/**
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py

sonar.python.coverage.reportPaths=coverage.xml
